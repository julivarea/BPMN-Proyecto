<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Página que muestra Spring Boot ante cualquier error no manejado (404, 500, etc.). -->
<head th:replace="~{fragmentos :: cabecera('Error')}"></head>
<body>
<header th:replace="~{fragmentos :: encabezado('')}"></header>
<main>
    <h1>Ocurrió un error</h1>
    <p class="error" th:text="${status} + ' · ' + ${error}">Error</p>
    <p><a th:href="@{/}">Volver al inicio</a></p>
</main>
</body>
</html>
