<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Elaborar Propuesta')}"></head>
<body>
<header th:replace="~{fragmentos :: encabezado(seccion)}"></header>
<main>
    <div th:replace="~{fragmentos :: mensajes}"></div>

    <a class="volver" th:href="@{'/' + ${seccion}}">← Volver a la bandeja</a>

    <h1>Registrar y elaborar propuesta (Versión <span th:text="${version}">1</span>)</h1>

    <div class="detalles">
        <h2>Datos de la solicitud</h2>
        <p><strong>Empresa:</strong> <span th:text="${curso.razonSocialEmpresa}">Empresa S.A.</span></p>
        <p><strong>Curso / Temática:</strong> <span th:text="${curso.nombre}">Nombre</span></p>
        <p><strong>Descripción:</strong> <span th:text="${curso.descripcion}">Descripción</span></p>
        <p><strong>Participantes estimados:</strong> <span th:text="${curso.participantesEstimados}">20</span></p>
        <p><strong>Fechas preferidas por empresa:</strong> <span th:text="${curso.fechasPreferidas}">Fechas</span></p>
    </div>

    <p th:if="${version > 1}">
        <a th:href="@{/tareas/propuestas/{cursoId}/{version}/pdf(cursoId=${curso.id}, version=${version - 1})}"
           target="_blank"
           rel="noopener"
           >Ver PDF de la propuesta v<span th:text="${version - 1}">1</span></a
        >
    </p>

    <form class="formulario" th:action="@{'/tareas/' + ${tarea.id()} + '/elaborar-propuesta'}" method="post">
        <input type="hidden" name="seccion" th:value="${seccion}">

        <label>Programa sintético del curso
            <textarea id="programa" name="programa" rows="6" required th:text="${curso.descripcion}"></textarea>
        </label>
        <label>Presupuesto estimado ($)
            <input type="number" step="0.01" min="0" id="presupuesto" name="presupuesto" required>
        </label>
        <label>Fechas y cronograma propuesto
            <textarea id="fechasPosibles" name="fechasPosibles" rows="3" required th:text="${curso.fechasPreferidas}"></textarea>
        </label>
        <div class="acciones">
            <button type="submit">Guardar propuesta y completar tarea</button>
            <a th:href="@{'/' + ${seccion}}" class="boton-secundario">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
