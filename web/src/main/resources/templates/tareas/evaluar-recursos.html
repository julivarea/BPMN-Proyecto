<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Evaluar recursos')}"></head>
<body>
<header th:replace="~{fragmentos :: encabezado(${seccion})}"></header>
<main>
    <div th:replace="~{fragmentos :: mensajes}"></div>

    <p><a th:href="@{'/' + ${seccion}}">← Volver a la bandeja</a></p>

    <h1>Evaluar recursos</h1>

    <div class="detalles">
        <h2>Datos de la solicitud</h2>
        <p><strong>Empresa:</strong> <span th:text="${curso.razonSocialEmpresa}">Empresa</span></p>
        <p><strong>Curso:</strong> <span th:text="${curso.nombre}">Nombre</span></p>
        <p><strong>Descripción:</strong> <span th:text="${curso.descripcion}">Descripción</span></p>
        <p><strong>Participantes estimados:</strong> <span th:text="${curso.participantesEstimados}">0</span></p>
        <p><strong>Fechas preferidas:</strong> <span th:text="${curso.fechasPreferidas}">Fechas</span></p>
    </div>

    <form th:action="@{'/tareas/' + ${tarea.id()} + '/evaluar-recursos'}" method="post">
        <input type="hidden" name="seccion" th:value="${seccion}">

        <fieldset>
            <legend>Recursos que necesita el curso</legend>
            <p>Marcá al menos uno. El curso reserva solo los recursos que marques.</p>
            <label>
                <input type="checkbox" name="requiereAula" value="true" th:checked="${requiereAula}">
                Aula física
            </label><br>
            <label>
                <input type="checkbox" name="requiereAulaVirtual" value="true" th:checked="${requiereAulaVirtual}">
                Aula virtual
            </label><br>
            <label>
                <input type="checkbox" name="requiereEquipamiento" value="true" th:checked="${requiereEquipamiento}">
                Equipamiento especial
            </label>
        </fieldset>

        <br>
        <button type="submit" class="boton">Confirmar recursos</button>
        <a th:href="@{'/' + ${seccion}}" class="boton-secundario">Cancelar</a>
    </form>
</main>
</body>
</html>
