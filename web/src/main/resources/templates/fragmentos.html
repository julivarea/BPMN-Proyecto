<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- Partes comunes de todas las páginas. Se incluyen con th:replace="~{fragmentos :: nombre}". -->
<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Institución de capacitación'">Institución de capacitación</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<!-- seccion: "solicitar", "empresas", "administracion", "docentes" o "" (ninguna). Marca el enlace de la página actual. -->
<header class="encabezado" th:fragment="encabezado(seccion)">
    <div class="encabezado-contenido">
        <a class="marca" th:href="@{/}">Institución de capacitación</a>
        <nav aria-label="Secciones del sitio">
            <a sec:authorize="!isAuthenticated() or hasRole('EMPRESA')" th:href="@{/solicitar}" th:aria-current="${seccion == 'solicitar'} ? 'page'">Solicitar curso</a>
            <a sec:authorize="hasRole('EMPRESA')" th:href="@{/empresas}" th:aria-current="${seccion == 'empresas'} ? 'page'">Mis cursos</a>
            <a sec:authorize="hasRole('ADMINISTRACION')" th:href="@{/administracion}" th:aria-current="${seccion == 'administracion'} ? 'page'">Mis tareas</a>
            <a sec:authorize="hasRole('DOCENTES')" th:href="@{/docentes}" th:aria-current="${seccion == 'docentes'} ? 'page'">Mis tareas</a>
        </nav>
        <!-- Usuario autenticado, o el enlace para ingresar. -->
        <form class="sesion" sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <span sec:authentication="name">usuario</span>
            <button type="submit">Salir</button>
        </form>
        <a class="sesion" sec:authorize="!isAuthenticated()" th:href="@{/login}">Ingresar</a>
    </div>
</header>

<!-- Mensajes para el usuario: los controllers los pasan como atributos "mensaje" y "error"
     (con RedirectAttributes.addFlashAttribute si la página viene de un redirect). -->
<div th:fragment="mensajes">
    <p class="mensaje" th:if="${mensaje}" th:text="${mensaje}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>
</div>

</body>
</html>
