server:
  port: 8081 # 8080 lo usa Flowable

spring:
  application:
    name: web-institucion
  datasource:
    url: ${INSTITUCION_DB_URL:jdbc:postgresql://localhost:5432/institucion}
    username: ${INSTITUCION_DB_USER:flowable}
    password: ${INSTITUCION_DB_PASSWORD:flowable}

# API REST de Flowable. Las credenciales son de la cuenta técnica con la que la web habla con el motor.
flowable:
  url: ${FLOWABLE_URL:http://localhost:8080/flowable-ui}/process-api
  usuario: ${FLOWABLE_USUARIO:admin}
  clave: ${FLOWABLE_CLAVE:test}

# Plazo que espera el proceso la respuesta de la empresa antes de cada recordatorio (duración ISO 8601).
# Para la demo se puede reducir, por ejemplo: PLAZO_RESPUESTA=PT1M
solicitudes:
  plazo-respuesta: ${PLAZO_RESPUESTA:P5D}
